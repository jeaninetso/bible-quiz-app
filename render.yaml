# Render "Blueprint" — deploys the whole app (API + Postgres + static
# frontend) from one file. In the Render dashboard: New -> Blueprint,
# point it at this repo, it reads this file automatically.
#
# Two env vars are marked `sync: false` (ESV/Anthropic API keys) because
# they're secrets — Render will prompt you to paste them in during setup
# rather than storing them in this file. Everything else is wired up
# automatically, including the Postgres connection string.
#
# CORS_ORIGIN/VITE_API_URL below assume Render assigns URLs matching the
# service `name`s above (https://<name>.onrender.com) — true as of this
# writing, but double check against the actual dashboard after a first
# deploy and fix + redeploy if a name collision forced Render to pick
# something else.

databases:
  - name: scripture-quest-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: scripture-quest-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips='*'
    envVars:
      # Pinned to match local dev (.venv is 3.12.13) — Render's Python
      # default drifts to whatever is newest (3.14 as of this writing),
      # and pydantic-core has no prebuilt wheel yet for brand-new Python
      # versions, so pip falls back to compiling its Rust extension from
      # source and fails in Render's build sandbox (read-only cargo cache).
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DATABASE_URL
        fromDatabase:
          name: scripture-quest-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax # safe again now the frontend proxies /api/* same-origin (see the frontend service's routes below) — real
        # browsers (Chrome, Safari) block third-party cookies by default even with SameSite=None;Secure, which broke
        # auth entirely when frontend/API were on different onrender.com subdomains. Proved via curl (server was
        # correct) vs. real Chrome (still blocked) during smoke testing.
      - key: CORS_ORIGIN
        value: https://scripture-quest-frontend.onrender.com
      - key: RATE_LIMIT_LOGIN
        value: 10/minute
      - key: RATE_LIMIT_QUIZ
        value: 20/hour
      - key: QUIZ_MODEL
        value: claude-haiku-4-5
      - key: ESV_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: scripture-quest-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Same-origin relative path, not the API's own onrender.com URL — see
      # the /api/* rewrite below. Keeps the session cookie first-party so
      # real browsers' third-party-cookie blocking doesn't break auth.
      - key: VITE_API_URL
        value: /api
    routes:
      # Reverse-proxy API calls through this site's own origin (order
      # matters: first match wins, so this must come before the SPA
      # fallback). Render forwards the request server-side and returns the
      # response as if it came from this origin — the browser never sees
      # scripture-quest-api.onrender.com directly, so the session cookie
      # set by that response is first-party here, not third-party.
      - type: rewrite
        source: /api/*
        destination: https://scripture-quest-api.onrender.com/*
      # SPA fallback: react-router handles client-side paths like /quiz/12,
      # which aren't real files — without this, refreshing on any route
      # other than / 404s.
      - type: rewrite
        source: /*
        destination: /index.html
